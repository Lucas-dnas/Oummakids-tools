<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index/oummakids-tool.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="./index/oummakids-tool.js" type="module" defer></script>
    <title>Tools-babysitter</title>
</head>

<body>

    <main>
        <section class="section-img-profile">
            <div id="div-img-profile"></div>
            <h1>Login</h1>

            <select id="selectLogin">
                <option value="admin@test.com password123">Admin</option>
            </select>

            <button id="Login" type="submit">Login</button>
            
            <div class="div- update-profile">
                <form method="PUT">
                    <label for="firstName">First name</label>
                    <input type="text" name="firstName" id="firstName">

                    <label for="lastName">Last name</label>
                    <input type="text" name="lastName" id="lastName">

                    <label for="address">Address</label>
                    <input type="text" name="address" id="address">

                    <label for="city">City</label>
                    <input type="text" name="city" id="city">

                    <label for="postalCode">Postal code</label>
                    <input type="text" name="postatCode" id="postalCode">

                    <label for="description">Description</label>
                    <input type="text" name="description" id="description">

                    <div id="div-parent-update-field">
                        <label for="children">Children</label>
                        <input type="number" name="children" id="children">
                    </div>

                    <div id="div-babysitter-upadate-fields">
                        <label for="rate">rate</label>
                        <input type="number" name="rate" id="rate">
                    </div>

                    <div id="div-babysitter-upadate-fields"></div>
                    <!-- faire le champ favoris -->
                    <button id="updateProfileBtn" type="submit">Update</button>
                </form>

                <a href="./src/templates/forgotPassword.html">I forgot my password</a>

            </div>
        </section>

        <section class="section-admin">
            <h2>Admin routes</h2>
            <div class="row">
                <button id="selectAllUsers" type="submit">Get all users</button>


                <button id="selectAllParents" type="submit">Select all parents</button>


                <button id="addBabysitter" type="submit">Babys +1</button>


                <button id="addParent" type="submit">Parent +1</button>


                <button id="incrementBabysitter" type="submit">Increment Babysitter</button>


                <button id="incrementParent" type="submit">incrementParent</button>
            </div>



        </section>
        <section class="section-user">
            <div class="div-user">
                <h2>Parents Routes</h2>
                <div class="row">
                    <button id="getProfile" type="submit">Get profile</button>

                    <button id="selectAllBabysitters" type="submit">Select all babysitters</button>
                    <button id="getAllChats" type="submit">Get all chats</button>
                    <div>
                        <button id="getProfileBabysitter" type="submit">Get profile babysitter</button>
                        <select id="selectProfileBabysitter">
                        </select>
                    </div>

                    <div>
                        <button id="createChat" type="submit">Create Chat</button>
                        <select id="selectCreateChat">
                        </select>
                    </div>


                    <div>
                        <button id="getChat" type="submit">Get chat</button>
                        <select id="selectChat">
                        </select>
                    </div>

                    <div>
                        <button id="deleteChat" type="submit">Delete chat</button>
                        <select id="selectDeleteChat">
                        </select>
                    </div>
                    <div>
                        <button id="parentProfile" type="submit">Get parent profile</button>
                        <select id="selectParentProfile">
                        </select>
                    </div>
                </div>
            </div>


            <div class="">
                <div class="message">
                    <select id="selectSendMessage">
                    </select>
                    <input type="text" id="inputSendMessage" class="inputSendMessage">
                    <button id="sendMessage" type="submit">Send message</button>
                </div>
            </div>


        </section>




        <section class="section-update" id="section-update">
            <div>
                <h3>Update profile image</h3>
                <form method="post" enctype="multipart/form-data">
                    <label for="inputImg">Chosse a picture:</label>
                    <input name="inputImg" id="inputImg" type="file" accept=".jpg, .jpeg, .pnj">
                </form>
                <button id="imgProfileBtn" type="submit">Update img</button>
            </div>
        </section>

        </section>
    </main>
</body>

</html>
