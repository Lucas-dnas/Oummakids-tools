<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./oummakids-tool.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="../index/oummakids-tool.js" type="module" defer></script>
    <title>Tools-babysitter</title>
</head>

<body>

    <main>

        <section>
            <h1>Login</h1>
            <select id="selectLogin">
                <option value="admin@test.com password123">Admin</option>
            </select>
            <button id="Login">Login</button>

            <div id="imgProfile"></div>
        </section>
        <section>

            <div id="imgProfile"></div>

            <div class="section-admin">
                <h2>Admin routes</h2>
                <div class="row">
                    <button id="selectAllUsers">Get all users</button>


                    <button id="selectAllParents">Select all parents</button>


                    <button id="addBabysitter">Babys +1</button>


                    <button id="addParent">Parent +1</button>


                    <button id="incrementBabysitter">Increment Babysitter</button>


                    <button id="incrementParent">incrementParent</button>
                </div>
            </div>



        </section>
        <section class="section-user">
            <div class="div-user">
                <h2>Parents Routes</h2>
                <div class="row">
                    <button id="getProfile">Get profile</button>
                    <button id="selectAllBabysitters">Select all babysitters</button>

                    <select id="selectProfileBabysitter"></select>
                    <button id="getProfileBabysitter">Get profile babysitter or parent when it's not your
                        profile</button>

                    <select id="selectCreateChat">
                    </select>
                    <button id="createChat">Create Chat</button>

                    <button id="getAllChats">Get all chats</button>

                    <select id="selectChat">
                    </select>
                    <button id="getChat">Get chat</button>

                    <select id="selectDeleteChat">
                    </select>
                    <button id="deleteChat">Delete chat</button>

                    <select id="selectParentProfile">
                    </select>
                    <button id="parentProfile">Get parent profile</button>
                    <button id="deleteUser" name="Babys">Delete User</button>
                </div>
            </div>
            <div class="section-user">
                <div class="message">
                    <select id="selectSendMessage">
                    </select>
                    <input type="text" id="inputSendMessage">
                    <button id="sendMessage">Send message</button>
                </div>
            </div>
        </section>
        <section class="section-update" id="section-update">
            <h3>Update profile image</h3>
            <form method="post" enctype="multipart/form-data">
                <label for="inputImg">Chosse a picture:</label>
                <input name="inputImg" id="inputImg" type="file" accept=".jpg, .jpeg, .pnj">
            </form>
            <button id="imgProfileBtn">Update img</button>
        </section>
    </main>
</body>

</html>
